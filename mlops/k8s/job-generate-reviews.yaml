apiVersion: batch/v1
kind: Job
metadata:
  name: generate-reviews
  namespace: mlops
  labels:
    app: mlops-pipeline
    stage: generate-reviews
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: mlops-pipeline
        stage: generate-reviews
    spec:
      serviceAccountName: mlops-sa
      restartPolicy: Never
      containers:
        - name: generate-reviews
          image: PLACEHOLDER_ECR_URL:latest
          args: ["--stage", "generate-reviews"]
          envFrom:
            - configMapRef:
                name: mlops-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
