apiVersion: batch/v1
kind: Job
metadata:
  name: sentiment-analysis
  namespace: mlops
  labels:
    app: mlops-pipeline
    stage: sentiment
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: mlops-pipeline
        stage: sentiment
    spec:
      serviceAccountName: mlops-sa
      restartPolicy: Never
      containers:
        - name: sentiment
          image: PLACEHOLDER_ECR_URL:latest
          args: ["--stage", "sentiment"]
          envFrom:
            - configMapRef:
                name: mlops-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
