apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - prometheus
  - alertmanager
  - grafana
  - loki
  - promtail
  - node-exporter
  - kube-state-metrics

labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring-stack
    includeSelectors: false
