apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Local environment patches
patches:
  # Reduce Prometheus resources for local
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: prometheus
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
    target:
      kind: Deployment
      name: prometheus

  # Reduce Grafana resources for local
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: grafana
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
    target:
      kind: Deployment
      name: grafana

  # Reduce Loki resources for local
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: loki
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: loki
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
    target:
      kind: StatefulSet
      name: loki
