apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: app
  labels:
    app.kubernetes.io/name: app-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: eks-app-mlops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-backend
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: app-serviceaccount
      containers:
        - name: backend
          image: public.ecr.aws/s0n1j8n3/app-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: "production"
            # CORS: Allow frontend origin
            - name: ALLOWED_ORIGIN
              value: "https://app.tk-k8s.com"
            # Database (CNPG)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-backend-secrets
                  key: DATABASE_URL
                  optional: true
            # JWT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-backend-secrets
                  key: JWT_SECRET
            # Storage mode (database for Neon, memory for testing)
            - name: ECSHOP_STORAGE_MODE
              value: "database"
            # Auth mode
            - name: ECSHOP_AUTH_MODE
              value: "simple"
            # External auth service (Render Cognito)
            # AUTH_SERVICE_URL: Set via ConfigMap or Secret in overlay
            - name: AUTH_SERVICE_URL
              value: ""
            # Analytics
            - name: ENABLE_ANALYTICS_API
              value: "true"
            - name: AWS_REGION
              value: "us-east-1"
            - name: S3_BUCKET_NAME
              value: "k8s-ml-platform-prod-data-k8smlplatf-k8smlplatformproddata3a-wxk8jv28bqg1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
