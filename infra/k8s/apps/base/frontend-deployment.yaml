apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-frontend
  namespace: app
  labels:
    app.kubernetes.io/name: app-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: eks-app-mlops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-frontend
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: app-serviceaccount
      containers:
        - name: frontend
          image: public.ecr.aws/s0n1j8n3/app-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://app-backend-service.app.svc.cluster.local:8000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
