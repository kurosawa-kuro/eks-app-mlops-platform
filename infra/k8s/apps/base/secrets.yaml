# Base secrets (for development)
# Production should use ExternalSecrets
apiVersion: v1
kind: Secret
metadata:
  name: app-backend-secrets
  namespace: app
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_LOCAL_DEV_32CHARS"
  DATABASE_URL: "postgresql://appuser:CHANGE_ME_APP_USER_PASSWORD@app-postgres-rw.database.svc.cluster.local:5432/appdb"
