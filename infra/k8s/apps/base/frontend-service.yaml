apiVersion: v1
kind: Service
metadata:
  name: app-frontend-service
  namespace: app
  labels:
    app.kubernetes.io/name: app-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app-frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
