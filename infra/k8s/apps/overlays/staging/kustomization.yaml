apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Frontend: 1 replica for staging
  - target:
      kind: Deployment
      name: app-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Backend: 1 replica for staging
  - target:
      kind: Deployment
      name: app-backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "https://staging.tk-k8s.com"

  # Ingress: Update hosts for staging
  - target:
      kind: Ingress
      name: app-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: staging.tk-k8s.com
      - op: replace
        path: /spec/rules/1/host
        value: api-staging.tk-k8s.com

configMapGenerator:
  - name: app-staging-config
    namespace: app
    literals:
      - ENVIRONMENT=staging
