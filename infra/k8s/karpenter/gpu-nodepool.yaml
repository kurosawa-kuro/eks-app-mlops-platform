apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload: gpu
    spec:
      # GPUノード専用: ドライバ/DevicePluginなどが乗る前提で taint
      taints:
        - key: "nvidia.com/gpu"
          value: "true"
          effect: NoSchedule

      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values:
            - spot
            - on-demand
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        # GPUインスタンス
        - key: "node.kubernetes.io/instance-type"
          operator: In
          values:
            - g5.xlarge
            - g5.2xlarge
            - g6.xlarge
            - g6.2xlarge

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu

  limits:
    cpu: 64
    memory: 256Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m











