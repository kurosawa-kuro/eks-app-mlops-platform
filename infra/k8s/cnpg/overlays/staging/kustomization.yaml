apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # 2 instances for staging (1 primary + 1 replica)
  - target:
      kind: Cluster
      name: app-postgres
    patch: |
      - op: replace
        path: /spec/instances
        value: 2
      - op: replace
        path: /spec/storage/size
        value: 5Gi
      - op: replace
        path: /spec/backup/barmanObjectStore/destinationPath
        value: s3://k8s-ml-platform-staging-data-backup/cnpg/
      - op: replace
        path: /spec/backup/retentionPolicy
        value: "7d"

configMapGenerator:
  - name: cnpg-env
    namespace: database
    literals:
      - ENVIRONMENT=staging
