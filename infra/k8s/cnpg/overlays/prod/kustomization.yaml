apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # ExternalSecrets disabled - using base Secrets instead
  # - external-secrets.yaml

patches:
  # Full HA configuration for production
  - target:
      kind: Cluster
      name: app-postgres
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/size
        value: 20Gi
      - op: replace
        path: /spec/resources
        value:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"

configMapGenerator:
  - name: cnpg-env
    namespace: database
    literals:
      - ENVIRONMENT=prod
