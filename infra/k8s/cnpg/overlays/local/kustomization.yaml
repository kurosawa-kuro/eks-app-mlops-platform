apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Reduce instances to 1 for local development
  - target:
      kind: Cluster
      name: app-postgres
    patch: |
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/size
        value: 1Gi
      - op: replace
        path: /spec/storage/storageClass
        value: standard
      - op: remove
        path: /spec/backup
      - op: remove
        path: /spec/affinity
      - op: replace
        path: /spec/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

configMapGenerator:
  - name: cnpg-env
    namespace: database
    literals:
      - ENVIRONMENT=local
