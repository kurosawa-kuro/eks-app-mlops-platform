# CNPG PostgreSQL Secrets
# Production: Use ExternalSecrets/AWS Secrets Manager instead

---
# Application Database User
apiVersion: v1
kind: Secret
metadata:
  name: pg-app-user
  namespace: database
type: Opaque
stringData:
  username: appuser
  password: CHANGE_ME_APP_USER_PASSWORD

---
# PostgreSQL Superuser (for admin access)
apiVersion: v1
kind: Secret
metadata:
  name: pg-superuser
  namespace: database
type: Opaque
stringData:
  username: postgres
  password: CHANGE_ME_SUPERUSER_PASSWORD

