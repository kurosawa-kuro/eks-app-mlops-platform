apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  namespace: monolith
  labels:
    app: monolith
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolith
  template:
    metadata:
      labels:
        app: monolith
    spec:
      serviceAccountName: monolith-serviceaccount
      containers:
        - name: monolith
          image: public.ecr.aws/s0n1j8n3/hono-mono-8000:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              value: "production-jwt-secret-must-be-changed-in-secrets-manager"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
